# ═══════════════════════════════════════════════════════════
# BTC 每小时振幅预警（7×24 云端运行，不需要开着网页）
#
# 【启用步骤】
# 1. 准备一个推送地址（二选一，都免费）：
#    · Server酱  → https://sct.ftqq.com  微信扫码登录拿 SendKey
#                  地址形如 https://sctapi.ftqq.com/你的KEY.send
#                  （在 Server酱 后台可把消息同时转发到邮箱）
#    · Bark(iOS) → App Store 装 Bark，复制 App 内地址
#                  地址形如 https://api.day.app/你的KEY
#
# 2. 打开仓库 Settings → Secrets and variables → Actions →
#    New repository secret，名称填 ALERT_WEBHOOK，值粘贴上面的地址。
#
# 3. 打开仓库 Actions 页签启用工作流。可先点 "Run workflow" 手动测一次。
#
# 【调整】
#   · 阈值：改下面 env 里的 THRESHOLD（默认 2，单位 %）
#   · 频率：改 cron。'5 * * * *' = 每小时第5分钟跑一次
#           （整点刚过时上一根小时K线才刚收完，所以错开5分钟）
#   · 说明：GitHub 定时任务在高峰期可能延迟几分钟，属正常现象
# ═══════════════════════════════════════════════════════════
name: BTC 振幅预警

on:
  schedule:
    - cron: '5 * * * *'      # 每小时第5分钟（UTC）
  workflow_dispatch:          # 支持在 Actions 页面手动运行测试

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检查上一根小时K线振幅并推送
        env:
          THRESHOLD: '2'                                # ★振幅阈值(%)
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}   # 手动运行时无论是否超阈值都推一条，便于测试
        run: |
          python3 - <<'PY'
          import os, json, datetime, urllib.parse, urllib.request

          hook = (os.environ.get('WEBHOOK') or '').strip()
          if not hook:
              print('未配置 ALERT_WEBHOOK secret，跳过。参见本文件顶部说明。')
              raise SystemExit(0)

          th    = float(os.environ.get('THRESHOLD', '2'))
          force = os.environ.get('FORCE') == 'true'

          # 取最近3根1小时K线，倒数第2根是刚收完的完整K线
          url = 'https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=3'
          with urllib.request.urlopen(url, timeout=20) as r:
              k = json.load(r)

          prev, cur = k[-3], k[-2]
          prev_close = float(prev[4])
          open_ms, high, low, close = int(cur[0]), float(cur[2]), float(cur[3]), float(cur[4])
          base = prev_close or float(cur[1]) or 1.0

          amp = (high - low) / base * 100          # 振幅% =(最高-最低)/前收
          chg = (close - prev_close) / base * 100  # 涨跌% =(收盘-前收)/前收
          print(f'上一小时振幅 {amp:.2f}%  阈值 {th}%')

          if amp < th and not force:
              print('未超阈值，无需提醒。')
              raise SystemExit(0)

          # 北京时间 = UTC+8
          t = datetime.datetime.utcfromtimestamp(open_ms / 1000) + datetime.timedelta(hours=8)
          title = f'⚠️ BTC振幅预警 {amp:.2f}%'
          msg = (f"BTC {t:%m月%d日 %H:00}（北京时间）振幅 {amp:.2f}%，阈值 {th}%\n"
                 f"最高 {high:,.0f}   最低 {low:,.0f}\n"
                 f"收盘 {close:,.0f}   涨跌 {chg:+.2f}%")
          if amp < th:
              msg = '【手动测试】\n' + msg
          print(msg)

          # 按推送服务类型组装请求
          try:
              if 'ftqq.com' in hook:                       # Server酱（可转微信/邮箱）
                  data = urllib.parse.urlencode({'title': title, 'desp': msg}).encode()
                  req = urllib.request.Request(hook, data=data)
              elif 'pushplus' in hook:                     # PushPlus
                  data = urllib.parse.urlencode({'title': title, 'content': msg}).encode()
                  req = urllib.request.Request(hook, data=data)
              else:                                        # Bark：<地址>/<标题>/<内容>
                  full = (hook.rstrip('/') + '/' +
                          urllib.parse.quote(title) + '/' + urllib.parse.quote(msg))
                  req = urllib.request.Request(full)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print('推送完成，服务端返回：', resp.status, resp.read()[:200].decode('utf-8', 'ignore'))
          except Exception as e:
              print('推送失败：', e)
              raise SystemExit(1)
          PY
