<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ═══════════════════════════════════════════════
       网站小图标：几何方块拼贴风格的「上升阶梯」原创标志
       三个 45° 旋转的方块（菱形）由小到大、由低到高排列，
       既是几何拼贴的调性，也直观表达「行情上行」。
       配色：青绿 → 金黄 渐变（自有配色，非任何交易所品牌色）
       改配色：下面 linearGradient 里的两个 stop-color
       ═══════════════════════════════════════════════ -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f9e93"/>
      <stop offset=".55" stop-color="#4fc3a1"/>
      <stop offset="1" stop-color="#f5b02e"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角底，便于在浅色列表/标签页中辨识 -->
  <rect width="64" height="64" rx="13" fill="#131722"/>

  <!-- 阶梯：小 → 中 → 大，逐级抬升 -->
  <rect x="10.5" y="35.5" width="13" height="13" rx="2.4"
        transform="rotate(45 17 42)" fill="url(#g)" opacity=".85"/>
  <rect x="23.5" y="23.5" width="17" height="17" rx="2.8"
        transform="rotate(45 32 32)" fill="url(#g)"/>
  <rect x="37.5" y="10.5" width="19" height="19" rx="3"
        transform="rotate(45 47 20)" fill="url(#g)"/>

  <!-- 左下角小方块：平衡构图的收尾点 -->
  <rect x="5" y="52" width="7" height="7" rx="1.4"
        transform="rotate(45 8.5 55.5)" fill="#f5b02e" opacity=".7"/>
</svg>
