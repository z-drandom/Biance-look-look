<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ═══════════════════════════════════════════════
       网站小图标：菱形方块拼贴
       上=红（涨） 下=绿（跌） 左右=金 中心=金 底=黑
       内容占满画面，小尺寸下轮廓清晰

       调整方法：
         想让图形更大/更小 → 改下面的 d（外块距中心距离）
         想改配色           → 改各 rect 的 fill
       ═══════════════════════════════════════════════ -->

  <!-- 黑色圆角底 -->
  <rect width="64" height="64" rx="13" fill="#000000"/>

  <!-- 上：红 -->
  <rect x="25.99" y="4.99" width="12.02" height="12.02" rx="2"
        transform="rotate(45 32 11)" fill="#f6465d"/>

  <!-- 下：绿 -->
  <rect x="25.99" y="46.99" width="12.02" height="12.02" rx="2"
        transform="rotate(45 32 53)" fill="#0ecb81"/>

  <!-- 左：金 -->
  <rect x="4.99" y="25.99" width="12.02" height="12.02" rx="2"
        transform="rotate(45 11 32)" fill="#f8b32c"/>

  <!-- 右：金 -->
  <rect x="46.99" y="25.99" width="12.02" height="12.02" rx="2"
        transform="rotate(45 53 32)" fill="#f8b32c"/>

  <!-- 中心：金（放大，作为视觉主体） -->
  <rect x="23.87" y="23.87" width="16.26" height="16.26" rx="2.6"
        transform="rotate(45 32 32)" fill="#f8b32c"/>
</svg>
