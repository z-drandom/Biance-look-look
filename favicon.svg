<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ═══════════════════════════════════════════════
       网站小图标：比特币标志
       橙色圆底 + 白色 ₿（手绘路径，不依赖字体，16px 下不糊）
       整个 B 按经典版式逆时针倾斜 14°
       改配色：circle 的 fill（#f7931a 是比特币官方橙）
       ═══════════════════════════════════════════════ -->
  <circle cx="32" cy="32" r="32" fill="#f7931a"/>

  <g transform="rotate(-14 32 32)" fill="#ffffff">
    <!-- 贯穿 B 的两道竖笔，露在上下两端 -->
    <rect x="19.5" y="7.5"  width="5.8" height="9.5" rx="1"/>
    <rect x="19.5" y="47"   width="5.8" height="9.5" rx="1"/>
    <rect x="30"   y="7.5"  width="5.8" height="9.5" rx="1"/>
    <rect x="30"   y="47"   width="5.8" height="9.5" rx="1"/>

    <!-- B 主体：外廓 + 两个镂空（evenodd 挖洞） -->
    <path fill-rule="evenodd" d="
      M19.5,16
      H34.5
      C41.6,16 45,19.6 45,24.4
      C45,28.2 43,30.7 39.6,31.8
      C43.9,32.7 47,35.8 47,40.4
      C47,45.6 43.2,48 36.3,48
      H19.5
      Z
      M25.3,20.6
      V29
      H33.6
      C36.7,29 38.3,27.6 38.3,24.8
      C38.3,22 36.7,20.6 33.6,20.6
      Z
      M25.3,35
      V43.4
      H35.6
      C38.9,43.4 40.6,41.9 40.6,39.2
      C40.6,36.5 38.9,35 35.6,35
      Z"/>
  </g>
</svg>
